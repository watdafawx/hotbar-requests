[mod-name]
hotbar-requests=Hotbar Requests

[mod-description]
hotbar-requests=Keeps a logistic request group in sync with your quickbar.

[mod-setting-name]
hotbar-requests-enabled=Request my hotbar items
hotbar-requests-group=Request group name
hotbar-requests-stacks=Stacks to request of each
hotbar-requests-pages=Quickbar pages to include
hotbar-requests-trash=Trash anything above the request

[mod-setting-description]
hotbar-requests-enabled=Keep a logistic request group in sync with the items pinned to your quickbar.
hotbar-requests-group=The logistic group (section) the hotbar items go into. Other requests are left alone.
hotbar-requests-stacks=How much to request of each hotbar item, in stacks (0.5 = half a stack). At least one item.
hotbar-requests-pages=How many quickbar pages (10 slots each) count, from the first.
hotbar-requests-trash=Also set the maximum to the requested amount, so robots take away extras.
